
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarot de la Carta del Día</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="contenedor">

        <h1>🔮 Tarot de la Carta del Día</h1>

        <p class="intro">
            Concéntrate un momento y descubre qué carta aparece para ti.
        </p>

        <div id="carta" class="carta">
            <div class="dorso">
                ✦
            </div>
        </div>

        <h2 id="nombreCarta">Tu carta está esperando...</h2>

        <p id="significado">
            Pulsa el botón para revelar tu carta.
        </p>

        <button onclick="revelarCarta()">
            ✨ Revelar mi carta
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
