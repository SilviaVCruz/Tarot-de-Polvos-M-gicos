
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tarot de la Carta del Día</title>

    <link rel="stylesheet" href="estilo.css">
</head>

<body>

    <main class="contenedor">

        <h1>🔮 Tarot de la Carta del Día</h1>

        <p class="intro">
            Concéntrate un momento y descubre qué carta aparece para ti.
        </p>

       <div id="carta" class="carta">

    <div class="cara dorso">
        ✦
    </div>

    <div class="cara frente">
        <img id="imagenCarta" src="el-sol.jpg" alt="Carta del Tarot El Sol">
    </div>
            
     </div>

        <h2 id="nombreCarta">Tu carta está esperando...</h2>

        <p id="significado">
            Pulsa el botón para revelar tu carta.
        </p>

        <button onclick="revelarCarta()">
            ✨ Revelar mi carta
        </button>

        <div class="musica">
    <p>🎵 Música mágica</p>

    <audio controls>
        <source src="Inspired.mp3" type="audio/mpeg">
        Tu navegador no puede reproducir este audio.
    </audio>

    <p class="atribucion">
        “Inspired” — Kevin MacLeod (incompetech.com)<br>
        Licencia Creative Commons: Atribución 4.0
    </p>
              
    </div>
    </main>

    <script src="script.js"></script>

</body>
</html>
